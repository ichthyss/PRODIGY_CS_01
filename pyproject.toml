[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caesar-cli"
version = "1.0.0"
description = "Command-line Caesar cipher encoder and decoder"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
caesar = "caesar.cli:main"

[tool.setuptools]
packages = ["caesar"]
